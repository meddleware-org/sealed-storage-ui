name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: node .github/audit-gate.mjs

      - name: Type-check
        run: npm run type-check

      - name: Lint CSS (stylelint)
        run: npm run lint:css

      - name: Lint JS (eslint + vuejs-a11y)
        run: npm run lint:js

      - name: Lint HTML (html-validate)
        run: npm run lint:html

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Third-party licence notices
        run: npm run check:licenses && test -s dist/THIRD_PARTY_LICENSES

      # Lighthouse runs on the production build; the browser tests then rebuild it in e2e mode (a mock wallet, a stub chain, a stand-in
      # Seal controller).
      - name: Lighthouse (accessibility 100, best practices, bundle budgets)
        run: npx lhci autorun

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser tests (five browsers, WCAG 2.2 AA and AAA, reflow, keyboard)
        run: npm run test:e2e
        env:
          E2E_BROWSERS: all
