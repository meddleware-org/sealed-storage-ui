# Continuous integration for sealed-storage-ui: static checks and unit tests, the production build and what must hold of it, the browser tests on five
# browsers, a container build and probe, and a file-system scan. The release workflows call this one, so a tag runs exactly the same checks.
name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

# DO_NOT_TRACK asks the tools run here not to send usage data.
env:
  DO_NOT_TRACK: "1"

# Read-only: no job here writes to the repository.
permissions:
  contents: read

# Independent jobs; the later ones that need a build wait for the first.
jobs:
  # The production build and the checks that need it.
  build:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a commit hash, with the version as a comment so Dependabot can update both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 26, the fleet baseline.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # A clean install from the lock file.
      - name: Install dependencies
        run: npm ci

      # The npm advisory check, against the repository's allow-list (.github/audit-allowlist.json); it complements the Trivy scan below.
      - name: Audit dependencies
        run: npx mw-audit-gate

      # The files synced from @meddleware/frontend-config (dependabot, postcss, stylelint, the Dockerfile CSP and others) must equal the templates.
      - name: Shared files are current
        run: npx mw-sync --check

      # vue-tsc over the sources.
      - name: Type-check
        run: npm run type-check

      # Stylelint over the stylesheets.
      - name: Lint CSS (stylelint)
        run: npm run lint:css

      # ESLint with the accessibility and browser-compatibility rules.
      - name: Lint JS (eslint + vuejs-a11y)
        run: npm run lint:js

      # html-validate over the pages.
      - name: Lint HTML (html-validate)
        run: npm run lint:html

      # The component tests.
      - name: Unit tests
        run: npm test

      # vite build into dist/.
      - name: Build
        run: npm run build

      # The built pages carry the icon set once and load nothing from a third party (tests/dist.test.ts; REQUIRE_DIST makes a missing dist/ a failure).
      - name: Built site (icon set once per page, no third-party loads)
        run: npx vitest run tests/dist.test.ts
        env:
          REQUIRE_DIST: '1'

      # The built pages hold no inline script the Dockerfile's Content-Security-Policy would refuse.
      - name: Inline scripts are covered by the CSP
        run: npm run check:csp

      # The production bundle contains none of the end-to-end build's mock wallet or stub chain.
      - name: Production build carries no e2e harness
        run: npm run check:bundle

      # Asking for the e2e switch in a production build must fail, so the harness can never be shipped by accident.
      - name: A production build refuses VITE_E2E
        run: |
          if VITE_E2E=1 npx vite build --outDir "$RUNNER_TEMP/refused" > /dev/null 2>&1; then
            echo "::error::a production build with VITE_E2E=1 succeeded: the e2e harness could be shipped"
            exit 1
          fi

      # The package tarball (npm pack) contains no e2e harness either.
      - name: Package contents (no e2e harness in the tarball)
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const j = JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))
            const p = Array.isArray(j) ? j[0] : Object.values(j)[0] // npm 12 keys the report by package name
            const bad = p.files.map((f) => f.path).filter((f) => /(^|\\/)e2e/.test(f))
            if (bad.length) { console.error('e2e files in the tarball:', bad); process.exit(1) }
          "

      # The licence notices file is produced and not empty.
      - name: Third-party licence notices
        run: npm run check:licenses && test -s dist/THIRD_PARTY_LICENSES

      # Lighthouse runs on the production build; the browser tests then rebuild it in e2e mode (a mock wallet, a stub chain, a stand-in
      # Seal controller).
      # Accessibility 100, best-practices and bundle-size budgets.
      - name: Lighthouse (accessibility 100, best practices, bundle budgets)
        run: npx lhci autorun

  # The Playwright version in the lockfile, so the browser jobs use the image built for exactly that version.
  playwright:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  # Browser tests.
  e2e:
    name: Browser tests (${{ matrix.project }})
    needs: playwright
    runs-on: ubuntu-latest
    # Every test on all five browser projects, as before. Each project runs in its own job at the same time, so the
    # run takes as long as the slowest project instead of all five in a row; each job runs in Playwright's image for
    # the locked version (the same browser builds, their system libraries installed), so none downloads browsers or
    # apt packages.
    container:
      # The container image is built and probed as the cluster runs it; it is not pushed from here.
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-resolute
      # Chromium's recommended shared-memory setting for containers.
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      # A bare runner gives sans-serif, serif, monospace and system-ui to DejaVu (Ubuntu's fonts-dejavu-core 2.37), and the
      # layout checks (reflow at 320 px, 200 % text, target sizes) were written against it. Playwright's image has no DejaVu,
      # and its CJK font would take those names. So: the same release from upstream (checksum pinned), preferred for them.
      # The layout checks were written against the Ubuntu runner's fonts; Playwright's image lacks them, so the same release is installed from upstream with its checksum pinned.
      - name: The runner's fonts (DejaVu 2.37)
        run: |
          curl -fsSL -o /tmp/dejavu.tar.bz2 https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.tar.bz2
          echo "fa9ca4d13871dd122f61258a80d01751d603b4d3ee14095d65453b4e846e17d7  /tmp/dejavu.tar.bz2" | sha256sum -c -
          mkdir -p /usr/share/fonts/truetype/dejavu
          python3 -c "import os, sys, tarfile; t = tarfile.open(sys.argv[1]); [open(os.path.join(sys.argv[2], os.path.basename(m.name)), 'wb').write(t.extractfile(m).read()) for m in t.getmembers() if m.name.endswith('.ttf')]" /tmp/dejavu.tar.bz2 /usr/share/fonts/truetype/dejavu
          printf '%s\n' '<?xml version="1.0"?>' '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">' '<fontconfig>' \
            '<match target="pattern"><test name="family"><string>sans-serif</string></test><edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit></match>' \
            '<match target="pattern"><test name="family"><string>system-ui</string></test><edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit></match>' \
            '</fontconfig>' > /etc/fonts/local.conf
          fc-cache -f
          for f in sans-serif system-ui serif monospace; do fc-match "$f" | grep -q DejaVu || { echo "::error::$f is $(fc-match "$f")"; exit 1; }; done

      # HOME only here: the image runs as root and Firefox refuses a HOME it does not own. Set on the command, not the job, so the
      # runner's own docker exec on the host does not read /root/.docker/config.json ("permission denied" warnings).
      # The same browser tests on all five projects (WCAG 2.2 AA and AAA, reflow, keyboard), against the end-to-end build with its mock wallet.
      - name: Browser tests (five browsers, WCAG 2.2 AA and AAA, reflow, keyboard)
        run: HOME=/root npm run test:e2e -- --project=${{ matrix.project }}
        env:
          E2E_BROWSERS: all
